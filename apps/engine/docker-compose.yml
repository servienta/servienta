# R7: one command brings the engine up. Host ports are never fixed (N4) —
# compose assigns them; GET /api/v1/endpoints reports in-container addresses,
# `docker compose port` maps them to the host.
services:
  servienta:
    build: .
    ports:
      - "8080" # control API
      - "8081" # files: HTTP
      - "8443" # files: HTTPS
      - "2121" # files: FTP (passive data ports are ephemeral; map them when crossing hosts)
      - "6969/udp" # files: TFTP
      - "2222" # files: SCP
      - "9000" # reference receiver
    volumes:
      - ${SERVIENTA_FIXTURES:-./fixtures}:/fixtures:ro
