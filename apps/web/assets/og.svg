<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Archivo Narrow', sans-serif">
  <rect width="1200" height="630" fill="#eef0f1"/>
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#c4cccd" stroke-width="1"/>
  <!-- corner ticks: 3 ink + 1 green -->
  <rect x="36" y="36" width="9" height="9" fill="#14181a"/>
  <rect x="1155" y="36" width="9" height="9" fill="#14181a"/>
  <rect x="36" y="585" width="9" height="9" fill="#14181a"/>
  <rect x="1155" y="585" width="9" height="9" fill="#2f7a52"/>
  <!-- top row: mark + wordmark, right meta -->
  <g transform="translate(104,96)">
    <g fill="#14181a">
      <rect x="0" y="0" width="8" height="8"/><rect x="14" y="0" width="8" height="8"/><rect x="28" y="0" width="8" height="8"/>
      <rect x="0" y="14" width="8" height="8"/><rect x="28" y="14" width="8" height="8"/>
      <rect x="0" y="28" width="8" height="8"/><rect x="14" y="28" width="8" height="8"/><rect x="28" y="28" width="8" height="8"/>
    </g>
    <rect x="14" y="14" width="8" height="8" fill="#2f7a52"/>
    <text x="56" y="30" font-size="26" font-weight="700" letter-spacing="4.6" fill="#14181a">SERVIENTA</text>
  </g>
  <text x="1096" y="122" text-anchor="end" font-family="'Fragment Mono', monospace" font-size="17" fill="#7d888b">test services · rev. A</text>
  <!-- headline -->
  <text x="104" y="330" font-size="104" font-weight="700" letter-spacing="-2" fill="#14181a">Network integrations,</text>
  <text x="104" y="426" font-size="104" font-weight="700" letter-spacing="-2" fill="#14181a">verifiable.</text>
  <!-- subtitle -->
  <text x="104" y="486" font-size="25" fill="#4a5457">A controlled instance of every endpoint your application talks to —</text>
  <text x="104" y="520" font-size="25" fill="#4a5457">up in one command, readable from your tests, resettable.</text>
  <!-- footer rule -->
  <rect x="104" y="548" width="992" height="2" fill="#14181a"/>
  <g font-family="'Fragment Mono', monospace" font-size="18" fill="#4a5457">
    <text x="104" y="576">servienta.com</text>
    <text x="1096" y="576" text-anchor="end">syslog · snmp · radius · tacacs+ · dns · ntp · kafka · ipfix</text>
  </g>
</svg>
