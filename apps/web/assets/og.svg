<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'IBM Plex Sans', sans-serif">
  <rect width="1200" height="630" fill="#0e0e12"/>
  <rect width="1200" height="2" fill="#8b6cff"/>
  <!-- faint 3x3 grid bottom-right, center glows -->
  <g opacity="0.55">
    <rect x="922" y="352" width="90" height="90" fill="#22222b"/>
    <rect x="1056" y="352" width="90" height="90" fill="#22222b"/>
    <rect x="1190" y="352" width="90" height="90" fill="#22222b"/>
    <rect x="922" y="486" width="90" height="90" fill="#22222b"/>
    <rect x="1056" y="486" width="90" height="90" fill="#8b6cff"/>
    <rect x="1190" y="486" width="90" height="90" fill="#22222b"/>
    <rect x="922" y="620" width="90" height="90" fill="#22222b"/>
    <rect x="1056" y="620" width="90" height="90" fill="#22222b"/>
    <rect x="1190" y="620" width="90" height="90" fill="#22222b"/>
  </g>
  <!-- brand lockup -->
  <g transform="translate(72,72)">
    <g fill="#3f3f4b">
      <rect x="0" y="0" width="9" height="9"/><rect x="16" y="0" width="9" height="9"/><rect x="32" y="0" width="9" height="9"/>
      <rect x="0" y="16" width="9" height="9"/><rect x="32" y="16" width="9" height="9"/>
      <rect x="0" y="32" width="9" height="9"/><rect x="16" y="32" width="9" height="9"/><rect x="32" y="32" width="9" height="9"/>
    </g>
    <rect x="16" y="16" width="9" height="9" fill="#8b6cff"/>
    <text x="59" y="34" font-size="32" font-weight="600" letter-spacing="-1" fill="#f5f5f7">Servienta</text>
  </g>
  <!-- headline -->
  <text x="72" y="330" font-size="82" font-weight="700" letter-spacing="-3.2" fill="#f5f5f7">Network integrations,</text>
  <text x="72" y="422" font-size="82" font-weight="700" letter-spacing="-3.2" fill="#8b6cff">verifiable.</text>
  <!-- subtitle -->
  <text x="72" y="486" font-size="26" fill="#a1a1ad">A controlled instance of every endpoint your application talks to —</text>
  <text x="72" y="522" font-size="26" fill="#a1a1ad">up in one command, readable from your tests, resettable.</text>
  <!-- footer -->
  <g font-family="'JetBrains Mono', monospace" font-size="20" fill="#71717f">
    <text x="72" y="582">servienta.com</text>
    <circle cx="232" cy="576" r="2.5" fill="#3f3f4b"/>
    <text x="252" y="582">syslog · snmp · radius · tacacs+ · dns · ntp · kafka · ipfix</text>
  </g>
