# The full stand: the engine (data plane) plus the console (management UI on
# :5000). The console reaches the engine over the internal network through the
# engine's versioned contract only (D11). A shared named volume holds the
# license the console writes and the engine reads at startup (variant B).
services:
  engine:
    build: ./apps/engine
    restart: unless-stopped # picks up a new license on console-triggered reload
    environment:
      SERVIENTA_LICENSE: /license/license.json
    volumes:
      - ${SERVIENTA_FIXTURES:-./fixtures}:/fixtures:ro
      - license:/license
    # The engine is published 1:1 so tests, the application under test, and you
    # reach it from the host exactly at the addresses it reports (R7). The
    # console lives on :5000 to keep :8080 free for the contract.
    ports:
      - "8080:8080" # control (the versioned contract)
      - "8081:8081" # files-http
      - "8443:8443" # files-https
      - "2121:2121" # files-ftp control
      - "50000-50100:50000-50100" # files-ftp passive data (fixed range, see ftp.go)
      - "2222:2222" # files-scp
      - "6969:6969/udp" # files-tftp (transfers reply from ephemeral ports; full
      #   TFTP transfers need the standalone engine or host networking)
      - "15353:5353/udp" # dns (host 5353/udp is mDNS on most desktops)
      - "1123:1123/udp" # ntp
      - "1812:1812/udp" # radius
      - "1162:1162/udp" # snmp-traps
      - "4739:4739/udp" # ipfix
      - "5514:5514/udp" # syslog-udp
      - "5515:5515" # syslog-tcp
      - "5516:5516" # syslog-relp
      - "9000:9000" # reference
      - "9092:9092" # kafka (kfake)
      - "49:49" # tacacs

  console:
    build:
      context: .
      dockerfile: apps/console/Dockerfile
    depends_on: [engine]
    environment:
      CONSOLE_ENGINE_BASE: http://engine:8080
      CONSOLE_ADDR: ":5000"
      CONSOLE_LICENSE_PATH: /license/license.json
    volumes:
      - license:/license
    ports:
      - "5000:5000"

volumes:
  license:
