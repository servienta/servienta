name: CI
on:
  push:
    branches: [main]
    paths: ["apps/servienta/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["apps/servienta/**"]

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/servienta } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: apps/servienta/go.mod }
      - run: go vet ./...
      - run: go test ./... -count=1

  engine-image:
    needs: engine
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - run: |
          docker build             -t ghcr.io/servienta/engine:latest             -t ghcr.io/servienta/engine:${{ github.sha }}             apps/servienta
      - run: docker push --all-tags ghcr.io/servienta/engine
