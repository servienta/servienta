name: CI
on:
  push:
    branches: [main]
    paths: ["apps/servienta/**", "docs/guide/**", "scripts/**", ".github/workflows/ci.yml", ".dockerignore"]
  pull_request:
    paths: ["apps/servienta/**", "docs/guide/**", "scripts/**"]

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/servienta } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: apps/servienta/go.mod }
      - run: go vet ./...
      - run: go test ./... -count=1

  # The single delivered image (D20): engine + embedded UI + user guide.
  # Build context is the repo root — the SPA build imports docs/guide and
  # scripts/walkthrough.sh from outside apps/servienta.
  image:
    needs: engine
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - run: |
          docker build \
            -t ghcr.io/servienta/servienta:latest \
            -t ghcr.io/servienta/servienta:${{ github.sha }} \
            -f apps/servienta/Dockerfile .
          docker push --all-tags ghcr.io/servienta/servienta
      # Registry retention: keep the 5 newest versions.
      - uses: actions/delete-package-versions@v5
        with:
          package-name: servienta
          package-type: container
          min-versions-to-keep: 5
