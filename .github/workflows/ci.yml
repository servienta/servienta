name: CI
on:
  push:
    branches: [main]
    paths: ["apps/engine/**", "apps/console/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["apps/engine/**", "apps/console/**"]

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/engine } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: apps/engine/go.mod }
      - run: go vet ./...
      - run: go test ./... -count=1

  engine-image:
    needs: engine
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - run: |
          docker build             -t ghcr.io/servienta/engine:latest             -t ghcr.io/servienta/engine:${{ github.sha }}             apps/engine
      - run: docker push --all-tags ghcr.io/servienta/engine
      - name: Build and push console
        run: |
          docker build \
            -t ghcr.io/servienta/console:latest \
            -t ghcr.io/servienta/console:${{ github.sha }} \
            -f apps/console/Dockerfile .
          docker push --all-tags ghcr.io/servienta/console
      # Registry retention: keep the 5 newest versions of each image.
      - uses: actions/delete-package-versions@v5
        with:
          package-name: engine
          package-type: container
          min-versions-to-keep: 5
      - uses: actions/delete-package-versions@v5
        with:
          package-name: console
          package-type: container
          min-versions-to-keep: 5
